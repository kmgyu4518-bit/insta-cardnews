name: Fetch card images

# Downloads a MiriCanvas JPG export (zip) into cards/<date>/ as 01.jpg ... NN.jpg.
# Does not publish anything.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Folder under cards/ (YYYY-MM-DD)"
        required: true
      zip_url:
        description: "Direct download URL of the JPG zip"
        required: true

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download and unpack
        env:
          ZIP_URL: ${{ inputs.zip_url }}
          CARD_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/cards.zip "$ZIP_URL"
          rm -rf /tmp/cards && mkdir -p /tmp/cards && unzip -q /tmp/cards.zip -d /tmp/cards
          dest="cards/$CARD_DATE"; mkdir -p "$dest"
          i=0
          find /tmp/cards -type f \( -iname '*.jpg' -o -iname '*.jpeg' \) | sort -V | while read -r f; do
            i=$((i+1)); cp "$f" "$dest/$(printf '%02d' "$i").jpg"
          done
          ls -la "$dest"
          file "$dest"/*.jpg
      - name: Commit
        env:
          CARD_DATE: ${{ inputs.date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "cards/$CARD_DATE"
          git diff --cached --quiet || git commit -m "Add cards $CARD_DATE"
          git push
